# Builds the executables and publishes a GitHub Release when a version tag is pushed:
#   git tag v1.0.2 && git push origin v1.0.2
# The version in the file names comes from the tag, not from package.json.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the release and upload the executables

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Use the tag as version
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      # Compiles TypeScript, bundles with ncc and packages Linux, macOS and Windows executables
      # into releases/ (see the build scripts in package.json)
      - run: npm run build

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: releases/*
          generate_release_notes: true
